<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre Hidropônica</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; color: #333; text-align: center; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #2e7d32; font-size: 22px; margin-bottom: 5px; }
        .status-timer { font-size: 18px; color: #4CAF50; font-weight: bold; margin: 15px 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { border: none; border-radius: 8px; padding: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        .btn-mode { background: #eee; color: #666; }
        .btn-active { background: #ffeb3b !important; color: #000; }
        .btn-off { background: #d32f2f; color: white; margin-top: 10px; }
        .btn-on { background: #388e3c; color: white; margin-top: 10px; }
        .timer-control { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
        .timer-label { font-size: 12px; color: #777; margin-bottom: 5px; display: block; }
        .stepper { font-size: 20px; font-weight: bold; color: #2e7d32; border: none; background: none; padding: 0 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Torre Hidropônica 🟢</h1>
    
    <div class="card">
        <div id="display-timer" class="status-timer">☀️ DIA: Espera 00:00</div>
        
        <div class="grid">
            <button id="btnManual" class="btn btn-mode" onclick="setModo(false)">Manual</button>
            <button id="btnAuto" class="btn btn-mode btn-active" onclick="setModo(true)">Auto</button>
        </div>

        <div class="grid">
            <div>
                <span class="timer-label">Bomba (R1)</span>
                <button id="btnR1" class="btn btn-off" onclick="toggleR1()">OFF</button>
            </div>
            <div>
                <span class="timer-label">Aux (R2)</span>
                <button id="btnR2" class="btn btn-off" onclick="toggleR2()">OFF</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top:0">⏱️ Controle de Tempo</h3>
        <div class="grid">
            <div>
                <span class="timer-label">Tempo Ligado Dia</span>
                <div class="timer-control">
                    <button class="stepper" onclick="changeTimer('tLD', -1)">-</button>
                    <span id="val-tLD">1</span>
                    <button class="stepper" onclick="changeTimer('tLD', 1)">+</button>
                </div>
            </div>
            <div>
                <span class="timer-label">Tempo Ligado Noite</span>
                <div class="timer-control">
                    <button class="stepper" onclick="changeTimer('tLN', -1)">-</button>
                    <span id="val-tLN">1</span>
                    <button class="stepper" onclick="changeTimer('tLN', 1)">+</button>
                </div>
            </div>
            </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendCmd(cmd) {
            tg.sendData(cmd); // Envia o comando de volta para o Bot
        }

        function setModo(auto) {
            document.getElementById('btnAuto').classList.toggle('btn-active', auto);
            document.getElementById('btnManual').classList.toggle('btn-active', !auto);
            sendCmd(auto ? "setmodo auto" : "setmodo manual");
        }

        function toggleR1() {
            const btn = document.getElementById('btnR1');
            const isOn = btn.innerText === "ON";
            btn.innerText = isOn ? "OFF" : "ON";
            btn.className = isOn ? "btn btn-off" : "btn btn-on";
            sendCmd("toggle r1");
        }

        function changeTimer(varName, delta) {
            const el = document.getElementById('val-' + varName);
            let val = parseInt(el.innerText) + delta;
            if(val < 1) val = 1;
            el.innerText = val;
            sendCmd("set" + varName + " " + val);
        }
    </script>
</body>
</html>
